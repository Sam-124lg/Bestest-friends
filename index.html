<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Bestest Friends</title>
    <link rel="stylesheet" href="bestfriend.css">
</head>
<body>

<nav><h1>My Bestest Friends</h1></nav>

<p>Enter Your Name</p>

<h3>
    <input type="text" id="userInput" placeholder="Your Name?">
</h3>

<!-- Clean button tag with standard disabled attribute -->
<button id="enterBtn" onclick="checkname()" disabled>Enter</button>

<!-- Friendship Rating Slider Container -->
<div class="slider-container">
    <label for="friendship-slider">Friendship Rating: <span id="slider-value">0</span>%</label>
    <input type="range" id="friendship-slider" min="0" max="100" value="0" oninput="updateSliderValue(this.value)">
    <div id="slider-message">Please rate our friendship to unlock! 🔒</div>
</div>

<script>
    function checkname() {
        let typedName = document.getElementById("userInput").value.trim().toLowerCase();

        if (typedName === "hafsa" || typedName === "momo") {
            window.location.href = "Momo.html";
        } else if (
            typedName === "husna" || 
            typedName === "hani"
        ) {
            window.location.href = "Hani.html";
        }
         else if (
            typedName === "anushey" || 
            typedName === "anusha" || 
            typedName === "ashu"
        ) {
            window.location.href = "ashu.html";
        }

        else {
            alert("Name not found!");
        }
    }

    function updateSliderValue(val) {
        document.getElementById("slider-value").innerText = val;
        
        let enterButton = document.getElementById("enterBtn");
        let messageText = "";

        // Toggles the true/false disabled property directly
        if (val > 0) {
            enterButton.disabled = false;
        } else {
            enterButton.disabled = true;
        }

        // Dynamic status feedback updates
        if (val == 0) {
            messageText = "Please rate our friendship to unlock! 🔒";
        } else if (val < 30) {
            messageText = "Acquaintances 🥶";
        } else if (val < 70) {
            messageText = "Good Friends! 🙂";
        } else if (val < 90) {
            messageText = "Best Friends!! 💞";
        } else {
            messageText = "Bestieeessss Forever! 💖✨";
        }
        
        document.getElementById("slider-message").innerText = messageText;
    }
</script>

</body>
</html>
